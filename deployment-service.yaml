apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-app
  namespace: webapps
  labels:
    app: netflix-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix-app
  template:
    metadata:
      labels:
        app: netflix-app
    spec:
      containers:
      - name: netflix-app
        image: punittak2005cse/netflix-clone:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: netflix-app
  namespace: webapps
  labels:
    app: netflix-app
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 32000
  selector:
    app: netflix-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-backend
  namespace: webapps
  labels:
    app: netflix-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netflix-backend
  template:
    metadata:
      labels:
        app: netflix-backend
    spec:
      containers:
      - name: netflix-backend
        image: punittak2005cse/netflix-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: TMDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: tmdb-secret
              key: TMDB_API_KEY
              optional: true
        - name: TMDB_BASE_URL
          value: "https://api.themoviedb.org/3"
---
apiVersion: v1
kind: Service
metadata:
  name: netflix-backend
  namespace: webapps
  labels:
    app: netflix-backend
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: netflix-backend
